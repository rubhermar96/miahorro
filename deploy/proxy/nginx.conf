# MiAhorro behind an nginx running directly on the VPS.
# 1. Copy to /etc/nginx/sites-available/miahorro.octogas.es and link it from sites-enabled.
# 2. sudo nginx -t && sudo systemctl reload nginx     (reload, not restart: octogas.es keeps serving)
# 3. sudo certbot --nginx -d miahorro.octogas.es       (adds HTTPS and the 80 -> 443 redirect)
server {
    listen 80;
    listen [::]:80;
    server_name miahorro.octogas.es;

    client_max_body_size 10m;  # bank statement uploads

    location / {
        proxy_pass http://127.0.0.1:8090;  # MIAHORRO_HTTP_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
