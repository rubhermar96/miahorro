# MiAhorro behind an Apache running directly on the VPS.
# 1. sudo a2enmod proxy proxy_http headers   (if not enabled yet)
# 2. Copy to /etc/apache2/sites-available/miahorro.octogas.es.conf ; sudo a2ensite miahorro.octogas.es
# 3. sudo apachectl configtest && sudo systemctl reload apache2   (reload: octogas.es keeps serving)
# 4. sudo certbot --apache -d miahorro.octogas.es
<VirtualHost *:80>
    ServerName miahorro.octogas.es

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
    RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"

    LimitRequestBody 10485760
</VirtualHost>
