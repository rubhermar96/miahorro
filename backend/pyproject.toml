[project]
name = "miahorro-api"
version = "0.1.0"
description = "API de MiAhorro"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.143.1",
    "greenlet>=3.5.6",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "sqladmin>=0.32.0",
    "sqlalchemy>=2",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "DTZ", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999", "E501"]
# SQLAdmin views are configured through mutable class attributes.
"app/admin.py" = ["RUF012"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "finance", "importers", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: test that needs a PostgreSQL database"]

[tool.coverage.run]
source = ["app", "finance", "importers"]
branch = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.169.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20260827",
]
