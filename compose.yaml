# Local development and end-to-end tests. Mirrors production (deploy/compose.prod.yaml)
# with throwaway credentials. Start everything:  docker compose up -d --build --wait
# Only the database (to run the API or tests outside Docker):  docker compose up -d db
# It listens on 127.0.0.1:15432 (not 5432, which a native PostgreSQL may already use).
name: miahorro-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: miahorro
      POSTGRES_PASSWORD: miahorro
      POSTGRES_DB: miahorro
    volumes:
      - db-data:/var/lib/postgresql
      - ./deploy/local/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    ports:
      - "127.0.0.1:${MIAHORRO_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miahorro -d miahorro"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      # Both can be overridden to try the app from a phone through an HTTPS tunnel
      # (see "Probar en el iPhone" in README.md).
      MIAHORRO_ENVIRONMENT: ${MIAHORRO_ENVIRONMENT:-development}
      MIAHORRO_PUBLIC_URL: ${MIAHORRO_PUBLIC_URL:-http://localhost:8080}
      MIAHORRO_DATABASE_URL: postgresql+psycopg://miahorro:miahorro@db:5432/miahorro
      MIAHORRO_SECRET_KEY: local-development-secret-key-not-for-production
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
