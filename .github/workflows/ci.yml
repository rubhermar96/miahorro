name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: miahorro
          POSTGRES_PASSWORD: miahorro
          POSTGRES_DB: miahorro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miahorro -d miahorro_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Formato
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tipos
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formato
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Cliente de la API al día
        run: npm run api:generate && git diff --exit-code -- src/api/schema.d.ts
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Extremo a extremo
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Arrancar la plataforma completa
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps webkit
        working-directory: frontend
      - name: Tests extremo a extremo (WebKit, iPhone)
        run: npm run e2e
        working-directory: frontend
      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
