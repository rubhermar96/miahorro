# Production on the shared VPS (RNF-18): own network, own database, resource limits, and the
# only published port bound to 127.0.0.1 so just the VPS's main proxy can reach it.
# Secrets come from deploy/.env (created by init-env.sh, never committed).
name: miahorro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miahorro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: miahorro
    volumes:
      - db-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miahorro -d miahorro"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    logging: *logging

  api:
    build: ../backend
    image: miahorro-api:latest
    restart: unless-stopped
    environment:
      MIAHORRO_ENVIRONMENT: production
      MIAHORRO_DATABASE_URL: postgresql+psycopg://miahorro:${POSTGRES_PASSWORD}@db:5432/miahorro
      MIAHORRO_SECRET_KEY: ${MIAHORRO_SECRET_KEY:?Falta MIAHORRO_SECRET_KEY en deploy/.env}
      MIAHORRO_LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    logging: *logging

  web:
    build: ../frontend
    image: miahorro-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MIAHORRO_HTTP_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.5" }
    logging: *logging

networks:
  internal: {}

volumes:
  db-data:
