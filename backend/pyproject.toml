[project]
name = "miahorro-api"
version = "0.1.0"
description = "API de MiAhorro"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "DTZ", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"migrations/**" = ["N999"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "finance", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: test that needs a PostgreSQL database"]

[tool.coverage.run]
source = ["app", "finance"]
branch = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.169.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
