# MiAhorro behind the nginx running directly on the VPS (the one serving octogas.es).
# Installed by install-nginx-site.sh, which backs up /etc/nginx, validates with `nginx -t`,
# reloads (never restarts) and then runs certbot to add HTTPS and the 80 -> 443 redirect.
server {
    listen 80;
    # Remove this line if the VPS has no IPv6 (nginx -t would fail and the script reverts).
    listen [::]:80;
    server_name miahorro.octogas.es;

    client_max_body_size 10m;  # bank statement uploads

    location / {
        proxy_pass http://127.0.0.1:8090;  # MIAHORRO_HTTP_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
